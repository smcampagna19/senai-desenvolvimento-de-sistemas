<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>Coletor de Moedas</title>

<style>

body {
    font-family: Arial;
    text-align: center;
    background-color: #f0f0f0;
}

#areaJogo {
    width: 600px;
    height: 400px;
    border: 3px solid black;
    margin: auto;
    position: relative;
    background-color: lightblue;
    overflow: hidden;
    cursor: none;
}

#jogador {
    width: 40px;
    height: 40px;
    background-color: green;
    position: absolute;
    border-radius: 5px;
}

#inimigo {
    width: 40px;
    height: 40px;
    background-color: red;
    position: absolute;
    border-radius: 5px;
}

.moeda {
    width: 30px;
    height: 30px;
    background-color: gold;
    position: absolute;
    border-radius: 50%;
    border: 2px solid orange;
}

#painel {
    margin-top: 15px;
    font-size: 22px;
}

#mensagem {
    font-size: 20px;
    color: darkred;
    font-weight: bold;
    margin-top: 8px;
    height: 26px;
}

</style>
</head>

<body>

<h1> Coletor de Moedas</h1>

<div id="areaJogo">
    <div id="jogador"></div>
    <div id="inimigo"></div>
    <div class="moeda" id="moeda"></div>
</div>

<div id="painel">
    Moedas: <span id="pontuacao">0</span> &nbsp;|&nbsp;
    Tempo: <span id="tempo">30</span>s &nbsp;|&nbsp;
    Vidas: <span id="vidas">3</span>
</div>

<div id="mensagem"></div>

<script src="script.js"></script>

</body>
</html>
